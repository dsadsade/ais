# ──────────────────────────────────────────
# GuardianAC Configuration
# AntiCheat for Minecraft 1.21.1
# ──────────────────────────────────────────

prefix: "&8[&c&lGuardianAC&8] "

# ──────────────────────────────────────────
# Violation Decay Settings
# Violations are automatically reduced over time to prevent
# players from being permanently flagged due to occasional false positives.
# ──────────────────────────────────────────
violation-decay:
  # How often (in seconds) the decay system runs
  interval-seconds: 30
  # How long (in seconds) a violation must be stale before it decays
  decay-after-seconds: 60

# ──────────────────────────────────────────
# Check Configuration
# Enable/disable checks and set their max-violation thresholds.
# When a player hits max-violation, the punishments below are executed.
#
# Combat checks use a Vulcan-style sub-check system (A, B, C...)
# Each sub-check targets a specific detection method.
# ──────────────────────────────────────────
